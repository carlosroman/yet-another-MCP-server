[project]
name = "yams"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Yet Another MCP Server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
yams = "yams.__main__:main"

[dependency-groups]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
lint = [
    "ruff",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
